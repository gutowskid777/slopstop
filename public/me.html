<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060a18">
<link rel="icon" href="/icon.png" type="image/png">
<title>Your ideas · SlopStop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap" rel="stylesheet">
<style>
/* Your ideas: sign in with the phone you text from, then just the ideas. Same night sky as the tree. */
:root {
  --sky: #060a18;
  --panel: #0d1428;
  --panel-2: #131c36;
  --line: #222d4b;
  --ink: #eef2fb;
  --mute: #8f9bbb;
  --gold: #ffc24a;
  --leaf: #6fdca3;
  --dry: #8a96a0;
  --red: #ff6b5e;
  --font: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; background: var(--sky); color: var(--ink); font-family: var(--font);
  background-image: radial-gradient(1200px 600px at 80% -10%, #12204a 0%, transparent 60%);
  background-attachment: fixed;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
[hidden] { display: none !important; }
.wrap { max-width: 760px; margin: 0 auto; padding: 22px 16px 80px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 30px; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 750; text-decoration: none; }
.brand img { width: 32px; height: 32px; border-radius: 8px; }
.ghost { border: 1px solid var(--line); background: transparent; border-radius: 12px; height: 40px; padding: 0 14px; font-size: 15px; color: var(--mute); }

/* Sign in */
.gate { max-width: 400px; margin: 9vh auto 0; display: grid; gap: 14px; text-align: center; }
.gate h1 { margin: 0; font-size: 40px; line-height: 1.05; font-weight: 750; letter-spacing: -0.025em; }
.gate p { margin: 0 0 8px; font-size: 17px; line-height: 1.45; color: var(--mute); }
.gate input { width: 100%; height: 60px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); padding: 0 18px; font-size: 22px; text-align: center; letter-spacing: 0.02em; }
.gate input:focus { outline: 2px solid var(--gold); outline-offset: 2px; }
.gate input.code { font-size: 30px; letter-spacing: 0.3em; font-variant-numeric: tabular-nums; }
.gate .go { width: 100%; height: 60px; border-radius: 16px; border: 0; background: var(--gold); color: #1a1405; font-size: 20px; font-weight: 700; }
.gate .go:disabled { opacity: .55; }
.link { background: none; border: 0; color: var(--mute); font-size: 15px; text-decoration: underline; text-underline-offset: 3px; padding: 6px; }
.err { min-height: 22px; color: var(--red); font-size: 16px; }

/* Ideas */
.head h1 { margin: 0; font-size: 40px; line-height: 1.05; font-weight: 750; letter-spacing: -0.025em; }
.head p { margin: 8px 0 24px; color: var(--mute); font-size: 17px; }
.list { display: grid; gap: 12px; }
.idea { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 6px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 18px; }
.score { grid-row: span 4; font-size: 48px; font-weight: 750; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.score.hi { color: var(--gold); }
.score.mid { color: var(--leaf); }
.score.lo { color: var(--dry); }
.idea h2 { margin: 0; font-size: 21px; line-height: 1.25; font-weight: 700; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 15px; color: var(--mute); }
.meta b { color: var(--ink); font-weight: 600; }
.tag { font-size: 13px; font-weight: 650; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); text-transform: uppercase; letter-spacing: .04em; }
.verdict { margin: 4px 0 0; font-size: 17px; line-height: 1.45; color: #d3dbee; overflow-wrap: anywhere; }
.next { margin: 0; font-size: 16px; line-height: 1.45; color: var(--mute); overflow-wrap: anywhere; }
.next b { color: var(--gold); font-weight: 650; }
.empty { text-align: center; color: var(--mute); font-size: 18px; padding: 40px 0; line-height: 1.5; }

@media (max-width: 560px) {
  .gate h1, .head h1 { font-size: 34px; }
  .idea { grid-template-columns: 56px minmax(0, 1fr); padding: 16px; }
  .score { font-size: 38px; }
}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <a class="brand" href="/"><img src="/icon.png" alt="">SlopStop</a>
    <button class="ghost" id="out" type="button" hidden>Sign out</button>
  </header>

  <section class="gate" id="ask" hidden>
    <h1>Your ideas</h1>
    <p>Type the number you text SlopStop from. We text that phone a code, so only you can open your ideas.</p>
    <form id="phone-form">
      <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="607 555 0134" aria-label="Phone number" required>
    </form>
    <button class="go" id="send" type="submit" form="phone-form">Text me a code</button>
    <div class="err" id="err1" role="alert"></div>
  </section>

  <section class="gate" id="enter" hidden>
    <h1>Check your texts</h1>
    <p id="sent-to">If that number uses SlopStop, a 6-digit code is on its way.</p>
    <form id="code-form">
      <input class="code" id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······" aria-label="6-digit code" required>
    </form>
    <button class="go" id="check" type="submit" form="code-form">Open my ideas</button>
    <div class="err" id="err2" role="alert"></div>
    <button class="link" id="back" type="button">Use a different number</button>
  </section>

  <section id="mine" hidden>
    <div class="head"><h1>Your ideas</h1><p id="count"></p></div>
    <div class="list" id="list"></div>
  </section>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  // Every word on an idea goes in as text, never as markup.
  const h = (tag, props = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else el.setAttribute(k, v);
    }
    for (const kid of kids) if (kid != null) el.append(kid);
    return el;
  };
  const post = (path, body) => fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const when = (iso) => new Date(iso).toLocaleDateString("en-US", { month: "short", day: "numeric" });

  function step(name) {
    for (const id of ["ask", "enter", "mine"]) $(id).hidden = id !== name;
    $("out").hidden = name !== "mine";
    setTimeout(() => (name === "ask" ? $("phone") : name === "enter" ? $("code") : null)?.focus(), 30);
  }

  function show(ideas) {
    $("count").textContent = ideas.length ? `${ideas.length} ${ideas.length === 1 ? "idea" : "ideas"}, newest first. Text SlopStop to add more.` : "";
    if (!ideas.length) return $("list").replaceChildren(h("div", { class: "empty", text: "No ideas yet. Text SlopStop one and it shows up here." }));
    $("list").replaceChildren(...ideas.map((i) => {
      const band = i.score >= 70 ? "hi" : i.score >= 40 ? "mid" : "lo";
      const status = i.hidden ? "hidden" : i.private ? "private" : null;
      return h("article", { class: "idea" },
        h("div", { class: `score ${band}`, text: String(i.score) }),
        h("h2", { text: i.title }),
        h("div", { class: "meta" }, h("b", { text: `Problem ${i.problem} · Fix ${i.fix}` }), h("span", { text: when(i.at) }), status ? h("span", { class: "tag", text: status }) : null),
        i.verdict ? h("p", { class: "verdict", text: i.verdict }) : null,
        i.move ? h("p", { class: "next" }, h("b", { text: "Next: " }), i.move) : null);
    }));
  }

  async function load() {
    const res = await fetch("/api/me");
    if (res.status === 401) return step("ask");
    show((await res.json()).ideas);
    step("mine");
  }

  $("phone-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("err1").textContent = "";
    $("send").disabled = true;
    const res = await post("/api/me/code", { phone: $("phone").value }).catch(() => undefined);
    $("send").disabled = false;
    if (!res?.ok) return ($("err1").textContent = (await res?.json().catch(() => ({})))?.error || "That didn't work. Try again.");
    $("code").value = "";
    step("enter");
  });

  $("code-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("err2").textContent = "";
    $("check").disabled = true;
    const res = await post("/api/me/verify", { phone: $("phone").value, code: $("code").value }).catch(() => undefined);
    $("check").disabled = false;
    if (!res?.ok) return ($("err2").textContent = (await res?.json().catch(() => ({})))?.error || "That didn't work. Try again.");
    load();
  });
  // The code fills itself from the text on iPhone. Six digits in, go.
  $("code").addEventListener("input", () => $("code").value.replace(/\D/g, "").length === 6 && $("code-form").requestSubmit());

  $("back").onclick = () => step("ask");
  $("out").onclick = async () => {
    await post("/api/me/out", {});
    step("ask");
  };

  // From the home page's "View your ideas": the number is already known, so the code goes out right away.
  let handed = "";
  try { handed = sessionStorage.getItem("ss-me-phone") || ""; sessionStorage.removeItem("ss-me-phone"); } catch {}
  load()
    .then(() => {
      if (handed && !$("ask").hidden) {
        $("phone").value = handed;
        $("phone-form").requestSubmit();
      }
    })
    .catch(() => step("ask"));
})();
</script>
</body>
</html>
