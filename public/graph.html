<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How the score works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/map.css">
<style>
  /* The same terrain as the map, seen from above: the summit is a big problem with a fix that costs nothing. */
  .panel h1 { font-size: clamp(38px, 3.5vw, 52px); line-height: 0.98; }
  .formula { font-weight: 900; font-size: 21px; letter-spacing: -0.01em; }
  .pins { display: grid; gap: 12px; margin-top: 2px; }
  .pin { display: grid; grid-template-columns: 32px auto 1fr; column-gap: 12px; align-items: center; border: 2px solid var(--ink); border-radius: 8px; background: #fff; padding: 10px 14px; }
  .pin-letter { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 17px; color: #fff; background: var(--ink); }
  .pin.b .pin-letter { background: var(--blaze); }
  .pin-score { font-weight: 900; font-size: 52px; line-height: 0.9; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; min-width: 1.5em; }
  .pin-what { font-weight: 800; font-size: 16px; line-height: 1.15; }
  .pin-nums { font-size: 14.5px; color: var(--soft); font-weight: 600; margin-top: 3px; }
  .gap { font-weight: 900; font-size: 24px; letter-spacing: -0.015em; line-height: 1.1; }
  .hint { font-size: 15px; color: var(--soft); }

  .plot { position: relative; min-width: 0; display: grid; place-items: center; padding: 18px; }
  #graph { display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
  #graph text { font-family: var(--font); fill: var(--ink); }
  .band { stroke: none; }
  .dead { fill: #c9d3bd; opacity: 0.55; }
  .iso { fill: none; stroke: var(--index); stroke-width: 1.3; }
  .iso.call { stroke: var(--ink); stroke-width: 1.6; stroke-dasharray: 2 6; stroke-linecap: round; opacity: 0.6; }
  .iso-num { font-size: 13px; font-weight: 600; fill: #6f8160 !important; }
  .frame { fill: none; stroke: var(--ink); stroke-width: 2; }
  .axis { font-size: 17px; font-weight: 900; }
  .end { font-size: 14px; font-weight: 600; fill: var(--soft) !important; }
  .zone-name { font-size: 20px; font-weight: 900; letter-spacing: -0.01em; }
  .zone-name.quiet { font-size: 16px; font-weight: 800; fill: var(--soft) !important; }
  .idea { stroke: var(--paper); stroke-width: 1.5; }
  .idea.sample { fill: var(--sheet); stroke: var(--soft); }
  .knob { cursor: grab; }
  .knob:active { cursor: grabbing; }
  .knob circle { stroke: #fff; stroke-width: 3; }
  .knob text { fill: #fff !important; font-weight: 900; font-size: 19px; text-anchor: middle; pointer-events: none; }
  .knob .tag { fill: var(--ink) !important; font-size: 22px; text-anchor: start; paint-order: stroke; stroke: var(--paper); stroke-width: 5; stroke-linejoin: round; }
  .knob:focus-visible { outline: none; }
  .knob:focus-visible circle { stroke: var(--ink); }

  @media (max-width: 820px) {
    .plot { padding: 10px 6px 18px; border-bottom: 2px solid var(--ink); }
    .pin-score { font-size: 48px; }
  }
</style>
</head>
<body>
<main class="shell">
  <section class="panel">
    <a class="mark" href="/" id="name">Bearing</a>
    <h1>The problem has to hurt twice as much as the fix.</h1>
    <p class="formula">score = 10 x problem - 5 x fix</p>
    <div class="pins">
      <div class="pin a"><span class="pin-letter">A</span><span class="pin-score" id="a-score">25</span><div><p class="pin-what" id="a-what"></p><p class="pin-nums" id="a-nums"></p></div></div>
      <div class="pin b"><span class="pin-letter">B</span><span class="pin-score" id="b-score">65</span><div><p class="pin-what" id="b-what"></p><p class="pin-nums" id="b-nums"></p></div></div>
    </div>
    <p class="gap" id="gap"></p>
    <p class="hint">Drag A and B. The dots are the ideas on the map.</p>
    <footer class="foot">
      <p>Fix is what it costs to adopt: finding it, learning it, the habit, paying, upkeep.</p>
      <a href="/">The map</a>
    </footer>
  </section>
  <section class="plot" id="plot" aria-label="Problem against fix">
    <svg id="graph" role="img" aria-label="Score for every mix of problem and fix. Top left scores highest."></svg>
  </section>
</main>
<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs = {}, text) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  };
  const score = (p, f) => Math.max(0, Math.min(100, 10 * p - 5 * f));
  const pins = { a: { p: 3, f: 1 }, b: { p: 9, f: 5 } };
  let ideas = [];
  let geo = null;

  const sizeWord = (p) => (p <= 3 ? "Small" : p <= 6 ? "Real" : p <= 8 ? "Big" : "Huge");
  const fixWord = (f) => (f <= 1 ? "super easy fix" : f <= 3 ? "easy fix" : f <= 5 ? "medium fix" : f <= 7 ? "heavy fix" : "brutal fix");

  function readout() {
    for (const k of ["a", "b"]) {
      const { p, f } = pins[k];
      $(`${k}-score`).textContent = score(p, f);
      $(`${k}-what`).textContent = `${sizeWord(p)} problem, ${fixWord(f)}`;
      $(`${k}-nums`).textContent = `problem ${p}, fix ${f}`;
    }
    const d = score(pins.b.p, pins.b.f) - score(pins.a.p, pins.a.f);
    $("gap").textContent = d === 0 ? "A and B tie." : `${d > 0 ? "B" : "A"} wins by ${Math.abs(d)}.`;
  }

  function draw() {
    const box = $("plot");
    const phone = matchMedia("(max-width: 820px)").matches;
    const side = Math.max(300, Math.min(box.clientWidth - (phone ? 12 : 36), phone ? 560 : box.clientHeight - 36));
    const m = { l: phone ? 46 : 62, r: 16, t: 16, b: phone ? 58 : 66 };
    const w = side - m.l - m.r, h = side - m.t - m.b;
    const X = (f) => m.l + (f / 10) * w, Y = (p) => m.t + (1 - p / 10) * h;
    geo = { X, Y, m, w, h };
    const svg = $("graph");
    svg.setAttribute("width", side);
    svg.setAttribute("height", side);
    svg.setAttribute("viewBox", `0 0 ${side} ${side}`);
    svg.replaceChildren();

    // Everything at or above score k is the corner above the line 10p - 5f = k.
    const region = (k) => {
      const pts = k <= 50 ? [[0, k / 10], [10, (k + 50) / 10], [10, 10], [0, 10]] : [[0, k / 10], [(100 - k) / 5, 10], [0, 10]];
      return pts.map(([f, p]) => `${X(f)},${Y(p)}`).join(" ");
    };
    const line = (k) => {
      const end = k <= 50 ? [10, (k + 50) / 10] : [(100 - k) / 5, 10];
      return `M${X(0)},${Y(k / 10)} L${X(end[0])},${Y(end[1])}`;
    };
    // Warmer as it climbs, like elevation tints on a map.
    for (let k = 10; k <= 90; k += 10) svg.append(el("polygon", { class: "band", points: region(k), fill: k >= 70 ? "#f2500a" : "#fff", opacity: k >= 70 ? 0.2 : 0.11 }));
    // Score 0: the fix costs as much as the problem hurts, or more.
    svg.append(el("polygon", { class: "dead", points: [[0, 0], [10, 0], [10, 5]].map(([f, p]) => `${X(f)},${Y(p)}`).join(" ") }));
    const tilt = (-Math.atan2(h * 0.05, w * 0.1) * 180) / Math.PI;
    for (let k = 0; k <= 90; k += 10) {
      const call = k === 70 || k === 40;
      svg.append(el("path", { class: `iso${call ? " call" : ""}`, d: line(k) }));
      if (k % 20 === 0 && k && k !== 40) {
        const f = 0.35, p = (k + 5 * f) / 10;
        svg.append(el("text", { class: "iso-num", x: X(f), y: Y(p) - 5, transform: `rotate(${tilt} ${X(f)} ${Y(p) - 5})` }, k));
      }
    }
    svg.append(el("rect", { class: "frame", x: m.l, y: m.t, width: w, height: h }));

    const along = (k, f, text, cls) => {
      const p = (k + 5 * f) / 10;
      svg.append(el("text", { class: cls, x: X(f), y: Y(p) - 9, transform: `rotate(${tilt} ${X(f)} ${Y(p) - 9})` }, text));
    };
    along(70, 0.35, "build it", "zone-name");
    along(40, 0.35, "sharpen it", "zone-name");
    along(0, phone ? 3.4 : 4.2, "scores 0: the fix costs more than the problem hurts", "zone-name quiet");

    // Axes, in plain words.
    svg.append(el("text", { class: "axis", x: m.l, y: side - (phone ? 30 : 34) }, "fix"));
    svg.append(el("text", { class: "end", x: m.l, y: side - (phone ? 12 : 14) }, "nothing to learn"));
    svg.append(el("text", { class: "end", x: m.l + w, y: side - (phone ? 12 : 14), "text-anchor": "end" }, "new habit, pay, upkeep"));
    const ax = phone ? 30 : 38;
    svg.append(el("text", { class: "axis", x: ax, y: m.t + h, transform: `rotate(-90 ${ax} ${m.t + h})` }, "problem"));
    svg.append(el("text", { class: "end", x: ax - 20, y: m.t + h, transform: `rotate(-90 ${ax - 20} ${m.t + h})` }, "mild"));
    svg.append(el("text", { class: "end", x: ax - 20, y: m.t, transform: `rotate(-90 ${ax - 20} ${m.t})`, "text-anchor": "end" }, "hair on fire"));

    // The ideas on the map. Integers pile up, so fan each pile out a little.
    const piles = new Map();
    for (const i of ideas) {
      const key = `${i.problem},${i.fix}`;
      const n = piles.get(key) ?? 0;
      piles.set(key, n + 1);
      const ang = n * 2.4, r = n ? 7 + n * 2.5 : 0;
      const c = el("circle", { class: `idea${i.sample ? " sample" : ""}`, cx: X(i.fix) + Math.cos(ang) * r, cy: Y(i.problem) + Math.sin(ang) * r, r: 5.5, fill: "#15251c" });
      c.append(el("title", {}, `${i.title}: ${i.score}`));
      svg.append(c);
    }

    for (const k of ["a", "b"]) {
      const { p, f } = pins[k];
      const g = el("g", { class: "knob", tabindex: 0, role: "slider", "aria-label": `Idea ${k.toUpperCase()}: problem ${p}, fix ${f}, score ${score(p, f)}. Arrow keys move it.`, "data-k": k, transform: `translate(${X(f)} ${Y(p)})` });
      g.append(el("circle", { r: 19, fill: k === "a" ? "#15251c" : "#f2500a" }));
      g.append(el("text", { y: 7 }, k.toUpperCase()));
      g.append(el("text", { class: "tag", x: f >= 8 ? -62 : 27, y: 8 }, score(p, f)));
      svg.append(g);
    }
    readout();
  }

  // Drag (or arrow-key) a pin. Ratings are whole numbers, so pins snap to the grid.
  const clamp = (n) => Math.max(0, Math.min(10, Math.round(n)));
  let dragging = null;
  const move = (e) => {
    if (!dragging) return;
    const r = $("graph").getBoundingClientRect();
    const f = clamp(((e.clientX - r.left - geo.m.l) / geo.w) * 10);
    const p = clamp((1 - (e.clientY - r.top - geo.m.t) / geo.h) * 10);
    if (f !== pins[dragging].f || p !== pins[dragging].p) {
      pins[dragging] = { p, f };
      draw();
    }
  };
  $("graph").addEventListener("pointerdown", (e) => {
    const k = e.target.closest(".knob")?.dataset.k;
    if (!k) return;
    dragging = k;
    $("graph").setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  $("graph").addEventListener("pointermove", move);
  for (const ev of ["pointerup", "pointercancel"]) $("graph").addEventListener(ev, () => (dragging = null));
  $("graph").addEventListener("keydown", (e) => {
    const k = e.target.closest(".knob")?.dataset.k;
    const step = { ArrowUp: [1, 0], ArrowDown: [-1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
    if (!k || !step) return;
    e.preventDefault();
    pins[k] = { p: clamp(pins[k].p + step[0]), f: clamp(pins[k].f + step[1]) };
    draw();
    $("graph").querySelector(`[data-k="${k}"]`)?.focus();
  });

  let resizing;
  addEventListener("resize", () => {
    clearTimeout(resizing);
    resizing = setTimeout(draw, 120);
  });

  const apply = (d) => {
    $("name").textContent = d.name;
    ideas = d.trunks.flatMap((t) => t.branches.flatMap((b) => b.ideas));
    if (!dragging) draw();
  };
  draw();
  fetch("/api/map", { cache: "no-store" }).then((r) => r.json()).then(apply).catch(() => {});
  const es = new EventSource("/api/events");
  es.onmessage = (e) => apply(JSON.parse(e.data));
})();
</script>
</body>
</html>
