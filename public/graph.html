<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/icon.png" type="image/png">
<title>How the score works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap" rel="stylesheet">
<style>
  /* The same night sky as the tree, and the same three calls: gold to build, green to sharpen, gray to drop. */
  :root { --paper: #060a18; --ink: #eef2fb; --soft: #93a0c0; --fruit: #ffc24a; --leaf: #55cf96; --font: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: radial-gradient(40% 32% at 24% 26%, rgba(64, 196, 160, 0.13) 0%, rgba(64, 196, 160, 0) 62%) fixed, radial-gradient(44% 36% at 80% 68%, rgba(120, 110, 255, 0.14) 0%, rgba(120, 110, 255, 0) 64%) fixed, radial-gradient(85% 75% at 60% 40%, #13244f 0%, #0a1230 40%, #060a18 74%, #02040b 100%) fixed var(--paper); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2.5px solid var(--ink); outline-offset: 2px; }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .shell { position: relative; display: grid; grid-template-columns: 470px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: 100dvh; overflow: hidden; }
  .panel { position: relative; display: flex; flex-direction: column; justify-content: center; gap: 30px; min-height: 0; padding: 0 18px 60px 56px; }
  .brand { position: absolute; top: 30px; left: 56px; display: inline-flex; align-items: center; gap: 10px; }
  .brand .logo { width: 34px; height: 34px; }
  .mark { font-weight: 800; font-size: 24px; line-height: 1; letter-spacing: -0.035em; text-decoration: none; text-shadow: 0 0 26px rgba(127, 227, 173, 0.45); }
  .panel h1 { font-size: 50px; line-height: 0.98; font-weight: 800; letter-spacing: -0.04em; text-wrap: balance; }
  .formula { margin-top: -12px; font-size: 19px; font-weight: 500; color: var(--soft); white-space: nowrap; }
  .weigh { display: none; } /* the agent scores with "half"; the other two weights were only for choosing it */
  .pins { display: grid; gap: 20px; }
  .pin { display: grid; grid-template-columns: 34px auto 1fr; column-gap: 14px; align-items: center; }
  .pin-letter { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 17px; color: #06241a; background: var(--leaf); }
  .pin.b .pin-letter { background: none; color: var(--ink); box-shadow: inset 0 0 0 2.5px var(--ink); }
  .pin-score { font-weight: 800; font-size: 58px; line-height: 0.86; letter-spacing: -0.045em; font-variant-numeric: tabular-nums; min-width: 1.45em; }
  .pin-what { font-weight: 700; font-size: 17px; line-height: 1.15; }
  .pin-math { display: none; }
  .gap { font-weight: 800; font-size: 24px; letter-spacing: -0.02em; line-height: 1.1; color: var(--fruit); }
  .hint { margin-top: -18px; font-size: 16px; color: var(--soft); }
  .foot { position: absolute; left: 56px; bottom: 28px; font-size: 14px; }
  .foot p { display: none; }
  .foot a { font-weight: 500; color: var(--soft); }

  .plot { position: relative; min-width: 0; min-height: 0; display: grid; place-items: center; padding: 26px 40px 26px 10px; }
  #graph { display: block; touch-action: none; user-select: none; -webkit-user-select: none; overflow: visible; }
  #graph text { font-family: var(--font); fill: var(--ink); }
  .low { fill: rgba(255, 255, 255, 0.045); }
  .mid { fill: rgba(85, 207, 150, 0.2); }
  .high { fill: var(--fruit); }
  .dead { fill: rgba(2, 4, 11, 0.55); opacity: 1; }
  .iso { fill: none; stroke: var(--ink); stroke-opacity: 0.1; stroke-width: 1; }
  .iso.call { stroke-opacity: 0.45; stroke-width: 1.4; }
  .iso-num { font-size: 13.5px; font-weight: 500; fill-opacity: 0.45; }
  .frame { fill: none; stroke: var(--ink); stroke-opacity: 0.55; stroke-width: 1.5; }
  .axis { font-size: 20px; font-weight: 800; letter-spacing: -0.015em; }
  .axis tspan { font-size: 15.5px; font-weight: 500; fill: var(--soft); letter-spacing: 0; }
  .end { font-size: 15.5px; font-weight: 500; fill: var(--soft) !important; }
  .zone-name { font-size: 22px; font-weight: 800; letter-spacing: -0.015em; }
  .zone-name.quiet { font-size: 15px; font-weight: 500; fill-opacity: 0.6; }
  .idea { fill: var(--ink); stroke: none; }
  .idea.sample { fill: var(--ink); fill-opacity: 0.16; stroke: none; }
  .knob { cursor: grab; }
  .knob:active { cursor: grabbing; }
  .knob circle { fill: var(--leaf); stroke: #06241a; stroke-width: 2; filter: drop-shadow(0 0 10px rgba(85, 207, 150, 0.6)); }
  .knob.b circle { fill: #0b1128; stroke: var(--ink); stroke-width: 2.5; filter: none; }
  .knob text { fill: #06241a !important; font-weight: 800; font-size: 20px; text-anchor: middle; pointer-events: none; }
  .knob.b text { fill: var(--ink) !important; }
  .knob .tag { fill: var(--ink) !important; font-size: 25px; text-anchor: start; paint-order: stroke; stroke: rgba(6, 10, 24, 0.75); stroke-width: 5; stroke-linejoin: round; }
  .knob:focus-visible { outline: none; }
  .knob:focus-visible circle { stroke: #fff; stroke-width: 3.5; }

  @media (max-width: 1100px) { .shell { grid-template-columns: 380px minmax(0, 1fr); } .panel { padding-left: 32px; } .brand, .foot { left: 32px; } .panel h1 { font-size: 42px; } }
  @media (max-width: 820px) {
    html, body { height: auto; }
    .shell { display: block; height: auto; overflow: visible; }
    .panel { gap: 22px; padding: 76px 20px 8px; }
    .brand { top: 18px; left: 20px; }
    .panel h1 { font-size: 40px; }
    .foot { position: static; margin-top: -6px; }
    .plot { padding: 8px 8px 30px; }
    .pin-score { font-size: 50px; }
    .zone-name { font-size: 18px; }
    .zone-name.quiet { font-size: 14px; }
    .axis { font-size: 18px; }
    .axis tspan, .end { font-size: 14px; }
  }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main class="shell">
  <section class="panel">
    <span class="brand"><img class="logo" src="/icon.png" style="border-radius:9px" alt="" width="34" height="34"><a class="mark" href="/" id="name">SlopStop</a></span>
    <h1 id="headline">The problem counts twice as much as the fix.</h1>
    <p class="formula" id="formula">score = 10 × problem − 5 × fix</p>
    <div class="weigh" role="group" aria-label="How heavy the fix weighs">
      <span>The fix weighs</span>
      <button type="button" data-w="0.5" aria-pressed="true">half</button>
      <button type="button" data-w="1" aria-pressed="false">the same</button>
      <button type="button" data-w="2" aria-pressed="false">double</button>
    </div>
    <div class="pins">
      <div class="pin a"><span class="pin-letter">A</span><span class="pin-score" id="a-score">25</span><div><p class="pin-what" id="a-what"></p><p class="pin-math" id="a-math"></p></div></div>
      <div class="pin b"><span class="pin-letter">B</span><span class="pin-score" id="b-score">65</span><div><p class="pin-what" id="b-what"></p><p class="pin-math" id="b-math"></p></div></div>
    </div>
    <p class="gap" id="gap"></p>
    <p class="hint">Drag A and B to compare two ideas.</p>
    <footer class="foot">
      <p>Fix is what it costs to adopt: finding it, learning it, the habit, paying, upkeep.</p>
      <a href="/">Back to the tree</a>
    </footer>
  </section>
  <section class="plot" id="plot" aria-label="Problem against fix">
    <svg id="graph" role="img" aria-label="Score for every mix of problem and fix. Top left scores highest."></svg>
  </section>
</main>
<script src="/sky.js"></script>
<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs = {}, text) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  };
  // How heavy the fix weighs against the problem. 0.5 is the live formula; 1 and 2 are the other two stories.
  let weigh = 0.5;
  const STORY = {
    0.5: "The problem counts twice as much as the fix.",
    1: "The problem has to beat the fix.",
    2: "The problem has to hurt twice as much as the fix.",
  };
  const ZERO = { 0.5: "scores 0: the fix costs double the problem", 1: "scores 0: the fix costs as much as the problem", 2: "scores 0: the problem isn't double the fix" };
  const score = (p, f) => Math.max(0, Math.min(100, 10 * p - 10 * weigh * f));
  const pins = { a: { p: 3, f: 1 }, b: { p: 9, f: 5 } };
  let ideas = [];
  let geo = null;

  const sizeWord = (p) => (p <= 3 ? "Small" : p <= 6 ? "Real" : p <= 8 ? "Big" : "Huge");
  const fixWord = (f) => (f <= 1 ? "super easy fix" : f <= 3 ? "easy fix" : f <= 5 ? "medium fix" : f <= 7 ? "heavy fix" : "brutal fix");

  function readout() {
    for (const k of ["a", "b"]) {
      const { p, f } = pins[k];
      $(`${k}-score`).textContent = score(p, f);
      $(`${k}-what`).textContent = `${sizeWord(p)} problem, ${fixWord(f)}`;
      $(`${k}-math`).textContent = `10 × ${p} − ${10 * weigh} × ${f}`;
    }
    $("headline").textContent = STORY[weigh];
    $("formula").textContent = `score = 10 × problem − ${10 * weigh} × fix`;
    const d = score(pins.b.p, pins.b.f) - score(pins.a.p, pins.a.f);
    $("gap").textContent = d === 0 ? "A and B tie." : `${d > 0 ? "B" : "A"} wins by ${Math.abs(d)}.`;
  }

  function draw() {
    const box = $("plot");
    const phone = matchMedia("(max-width: 820px)").matches;
    const side = Math.max(300, Math.min(box.clientWidth - (phone ? 16 : 36), phone ? 560 : box.clientHeight - 28));
    const m = { l: 6, r: 6, t: phone ? 34 : 40, b: phone ? 58 : 66 };
    const w = side - m.l - m.r, h = side - m.t - m.b;
    const X = (f) => m.l + (f / 10) * w, Y = (p) => m.t + (1 - p / 10) * h;
    geo = { X, Y, m, w, h };
    const svg = $("graph");
    svg.setAttribute("width", side);
    svg.setAttribute("height", side);
    svg.setAttribute("viewBox", `0 0 ${side} ${side}`);
    svg.replaceChildren();

    // Everything at or above score c is the corner above the line 10p - 10 x weigh x f = c.
    const edge = (c) => {
      const top = (100 - c) / (10 * weigh); // the fix at which the line reaches problem 10
      return top >= 10 ? [10, c / 10 + weigh * 10] : [top, 10];
    };
    const region = (c) => {
      const e = edge(c);
      const pts = e[0] === 10 && e[1] < 10 ? [[0, c / 10], e, [10, 10], [0, 10]] : [[0, c / 10], e, [0, 10]];
      return pts.map(([f, p]) => `${X(f)},${Y(p)}`).join(" ");
    };
    const line = (c) => `M${X(0)},${Y(c / 10)} L${X(edge(c)[0])},${Y(edge(c)[1])}`;
    // The same three calls as the tree: drop it, sharpen it from 40, build it from 70.
    svg.append(el("rect", { class: "low", x: m.l, y: m.t, width: w, height: h }));
    svg.append(el("polygon", { class: "mid", points: region(40) }));
    svg.append(el("polygon", { class: "high", points: region(70) }));
    // Score 0: the fix costs double the pain, or more.
    const dead = weigh > 1 ? [[0, 0], [10, 0], [10, 10], [10 / weigh, 10]] : [[0, 0], [10, 0], [10, 10 * weigh]];
    svg.append(el("polygon", { class: "dead", points: dead.map(([f, p]) => `${X(f)},${Y(p)}`).join(" ") }));
    const tilt = (-Math.atan2(h * weigh * 0.1, w * 0.1) * 180) / Math.PI;
    for (let k = 0; k <= 90; k += 10) {
      svg.append(el("path", { class: `iso${k === 70 || k === 40 ? " call" : ""}`, d: line(k) }));
      if (k % 20 === 0 && k) {
        // Named at the far end of the line, so nobody reads the number as a step on the problem scale.
        const far = Math.min(10, (10 - k / 10) / weigh), f = far - (far < 10 ? 0.75 : 0.22), p = k / 10 + weigh * f;
        svg.append(el("text", { class: "iso-num", x: X(f), y: Y(p) - 6, "text-anchor": "end", transform: `rotate(${tilt} ${X(f)} ${Y(p) - 6})` }, `score ${k}`));
      }
    }
    svg.append(el("rect", { class: "frame", x: m.l, y: m.t, width: w, height: h }));

    // Axes in plain words, set level so nobody has to tilt their head.
    const up = el("text", { class: "axis", x: m.l, y: m.t - 12 }, "↑ problem ");
    up.append(el("tspan", {}, "how much it hurts"));
    svg.append(up);
    svg.append(el("text", { class: "axis", x: m.l, y: m.t + h + (phone ? 28 : 32) }, "fix →"));
    svg.append(el("text", { class: "end", x: m.l, y: side - 6 }, "nothing to learn"));
    svg.append(el("text", { class: "end", x: m.l + w, y: side - 6, "text-anchor": "end" }, "a new habit, a price, upkeep"));

    // The ideas on the tree. Ratings are whole numbers, so many share a spot: samples become one circle
    // that grows with how many there are, and each idea that was texted in is a solid dot on top.
    const piles = new Map();
    for (const i of ideas) {
      const key = `${i.problem},${i.fix}`;
      const pile = piles.get(key) ?? { p: i.problem, f: i.fix, samples: 0, real: [] };
      pile.samples++;
      piles.set(key, pile);
    }
    for (const pile of piles.values()) {
      if (pile.samples) svg.append(el("circle", { class: "idea sample", cx: X(pile.f), cy: Y(pile.p), r: 3.5 + 3 * Math.sqrt(pile.samples) }));
    }
    for (const pile of piles.values()) {
      pile.real.forEach((i, n) => {
        const ang = n * 2.4, r = n ? 9 + n * 2.5 : 0;
        const c = el("circle", { class: "idea", cx: X(pile.f) + Math.cos(ang) * r, cy: Y(pile.p) + Math.sin(ang) * r, r: 6.5 });
        c.append(el("title", {}, `${i.title}: ${i.score}`));
        svg.append(c);
      });
    }

    // Zone names go on last so the ideas never sit on top of the words.
    const along = (c, f, text, cls) => {
      const p = c / 10 + weigh * f;
      svg.append(el("text", { class: cls, x: X(f), y: Y(p) - 10, transform: `rotate(${tilt} ${X(f)} ${Y(p) - 10})` }, text));
    };
    along(70, 0.3, "build it", "zone-name");
    along(40, 0.3, "sharpen it", "zone-name");
    along(0, 0.3, "drop it", "zone-name");
    along(0, { 0.5: phone ? 5.4 : 4.4, 1: phone ? 3 : 2.2, 2: phone ? 2.6 : 2.4 }[weigh], phone ? "scores 0" : ZERO[weigh], "zone-name quiet");

    for (const k of ["a", "b"]) {
      const { p, f } = pins[k];
      const g = el("g", { class: `knob ${k}`, tabindex: 0, role: "slider", "aria-label": `Idea ${k.toUpperCase()}: problem ${p}, fix ${f}, score ${score(p, f)}. Arrow keys move it.`, "data-k": k, transform: `translate(${X(f)} ${Y(p)})` });
      g.append(el("circle", { r: 21 }));
      g.append(el("text", { y: 7.5 }, k.toUpperCase()));
      g.append(el("text", { class: "tag", x: f >= 8 ? -70 : 30, y: 9 }, score(p, f)));
      svg.append(g);
    }
    readout();
  }

  // Drag (or arrow-key) a pin. Ratings are whole numbers, so pins snap to the grid.
  const clamp = (n) => Math.max(0, Math.min(10, Math.round(n)));
  let dragging = null;
  const move = (e) => {
    if (!dragging) return;
    const r = $("graph").getBoundingClientRect();
    const f = clamp(((e.clientX - r.left - geo.m.l) / geo.w) * 10);
    const p = clamp((1 - (e.clientY - r.top - geo.m.t) / geo.h) * 10);
    if (f !== pins[dragging].f || p !== pins[dragging].p) {
      pins[dragging] = { p, f };
      draw();
    }
  };
  $("graph").addEventListener("pointerdown", (e) => {
    const k = e.target.closest(".knob")?.dataset.k;
    if (!k) return;
    dragging = k;
    $("graph").setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  $("graph").addEventListener("pointermove", move);
  for (const ev of ["pointerup", "pointercancel"]) $("graph").addEventListener(ev, () => (dragging = null));
  $("graph").addEventListener("keydown", (e) => {
    const k = e.target.closest(".knob")?.dataset.k;
    const step = { ArrowUp: [1, 0], ArrowDown: [-1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
    if (!k || !step) return;
    e.preventDefault();
    pins[k] = { p: clamp(pins[k].p + step[0]), f: clamp(pins[k].f + step[1]) };
    draw();
    $("graph").querySelector(`[data-k="${k}"]`)?.focus();
  });

  document.querySelector(".weigh").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    weigh = Number(b.dataset.w);
    for (const o of document.querySelectorAll(".weigh button")) o.setAttribute("aria-pressed", String(o === b));
    draw();
  });

  let resizing;
  new ResizeObserver(() => {
    clearTimeout(resizing);
    resizing = setTimeout(draw, 120);
  }).observe($("plot"));

  const apply = (d) => {
    $("name").textContent = "SlopStop";
    ideas = d.trunks.flatMap((t) => t.branches.flatMap((b) => b.ideas));
    if (!dragging) draw();
  };
  draw();
  fetch("/api/map", { cache: "no-store" }).then((r) => r.json()).then(apply).catch(() => {});
  const es = new EventSource("/api/events");
  es.onmessage = (e) => apply(JSON.parse(e.data));
})();
</script>
</body>
</html>
