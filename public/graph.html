<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How the score works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/map.css">
<style>
  /* The same land as the map, seen from above. The summit is a big problem with a fix that costs nothing. */
  .panel h1 { font-size: clamp(38px, 3.5vw, 52px); line-height: 0.98; }
  .formula { font-weight: 900; font-size: 20px; letter-spacing: -0.01em; white-space: nowrap; }
  .pins { display: grid; gap: 16px; margin-top: 6px; }
  .pin { display: grid; grid-template-columns: 36px auto 1fr; column-gap: 12px; align-items: center; }
  .pin-letter { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 19px; color: #fff; background: var(--ink); }
  .pin.b .pin-letter { background: var(--blaze); }
  .pin-score { font-weight: 900; font-size: 60px; line-height: 0.86; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; min-width: 1.45em; }
  .pin-what { font-weight: 800; font-size: 17px; line-height: 1.15; }
  .pin-math { font-size: 16px; color: var(--soft); font-weight: 700; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .gap { font-weight: 900; font-size: 26px; letter-spacing: -0.015em; line-height: 1.1; margin-top: 4px; }
  .hint { font-size: 15.5px; color: var(--soft); }

  .plot { position: relative; min-width: 0; min-height: 0; display: grid; place-items: center; padding: 14px 18px; }
  #graph { display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
  #graph text { font-family: var(--font); fill: var(--ink); }
  .low { fill: #b7c7a0; }
  .mid { fill: #cddab9; }
  .high { fill: var(--blaze); opacity: 0.5; }
  .dead { fill: #15251c; opacity: 0.16; }
  .iso { fill: none; stroke: #15251c; stroke-opacity: 0.16; stroke-width: 1.2; }
  .iso.call { stroke-opacity: 0.6; stroke-width: 1.75; }
  .iso-num { font-size: 15px; font-weight: 700; fill-opacity: 0.55; }
  .frame { fill: none; stroke: var(--ink); stroke-width: 2.75; }
  .axis { font-size: 22px; font-weight: 900; letter-spacing: -0.01em; }
  .axis tspan { font-size: 16.5px; font-weight: 600; fill: var(--soft); letter-spacing: 0; }
  .end { font-size: 16.5px; font-weight: 600; fill: var(--soft) !important; }
  .zone-name { font-size: 23px; font-weight: 900; letter-spacing: -0.01em; paint-order: stroke; stroke: #eef3e6; stroke-width: 6; stroke-linejoin: round; }
  .zone-name.quiet { font-size: 17px; font-weight: 800; }
  .idea { stroke: #f5f8ee; stroke-width: 2; }
  .idea.sample { fill: var(--sheet); stroke: var(--ink); stroke-width: 2; }
  .knob { cursor: grab; }
  .knob:active { cursor: grabbing; }
  .knob circle { stroke: #fff; stroke-width: 3.5; }
  .knob text { fill: #fff !important; font-weight: 900; font-size: 21px; text-anchor: middle; pointer-events: none; }
  .knob .tag { fill: var(--ink) !important; font-size: 26px; text-anchor: start; paint-order: stroke; stroke: #eef3e6; stroke-width: 6; stroke-linejoin: round; }
  .knob:focus-visible { outline: none; }
  .knob:focus-visible circle { stroke: var(--ink); }

  @media (max-width: 820px) {
    .plot { padding: 12px 8px 18px; border-bottom: 2px solid var(--ink); }
    .pin-score { font-size: 52px; }
    .zone-name { font-size: 19px; }
    .zone-name.quiet { font-size: 15px; }
    .axis { font-size: 19px; }
    .axis tspan, .end { font-size: 14.5px; }
  }
</style>
</head>
<body>
<main class="shell">
  <section class="panel">
    <a class="mark" href="/" id="name">Bearing</a>
    <h1>The problem counts twice as much as the fix.</h1>
    <p class="formula">score = 10 x problem - 5 x fix</p>
    <div class="pins">
      <div class="pin a"><span class="pin-letter">A</span><span class="pin-score" id="a-score">25</span><div><p class="pin-what" id="a-what"></p><p class="pin-math" id="a-math"></p></div></div>
      <div class="pin b"><span class="pin-letter">B</span><span class="pin-score" id="b-score">65</span><div><p class="pin-what" id="b-what"></p><p class="pin-math" id="b-math"></p></div></div>
    </div>
    <p class="gap" id="gap"></p>
    <p class="hint">Drag A and B. The dots are the ideas on the map.</p>
    <footer class="foot">
      <p>Fix is what it costs to adopt: finding it, learning it, the habit, paying, upkeep.</p>
      <a href="/">The map</a>
    </footer>
  </section>
  <section class="plot" id="plot" aria-label="Problem against fix">
    <svg id="graph" role="img" aria-label="Score for every mix of problem and fix. Top left scores highest."></svg>
  </section>
</main>
<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs = {}, text) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  };
  const score = (p, f) => Math.max(0, Math.min(100, 10 * p - 5 * f));
  const pins = { a: { p: 3, f: 1 }, b: { p: 9, f: 5 } };
  let ideas = [];
  let geo = null;

  const sizeWord = (p) => (p <= 3 ? "Small" : p <= 6 ? "Real" : p <= 8 ? "Big" : "Huge");
  const fixWord = (f) => (f <= 1 ? "super easy fix" : f <= 3 ? "easy fix" : f <= 5 ? "medium fix" : f <= 7 ? "heavy fix" : "brutal fix");

  function readout() {
    for (const k of ["a", "b"]) {
      const { p, f } = pins[k];
      $(`${k}-score`).textContent = score(p, f);
      $(`${k}-what`).textContent = `${sizeWord(p)} problem, ${fixWord(f)}`;
      $(`${k}-math`).textContent = `10 x ${p} - 5 x ${f}`;
    }
    const d = score(pins.b.p, pins.b.f) - score(pins.a.p, pins.a.f);
    $("gap").textContent = d === 0 ? "A and B tie." : `${d > 0 ? "B" : "A"} wins by ${Math.abs(d)}.`;
  }

  function draw() {
    const box = $("plot");
    const phone = matchMedia("(max-width: 820px)").matches;
    const side = Math.max(300, Math.min(box.clientWidth - (phone ? 16 : 36), phone ? 560 : box.clientHeight - 28));
    const m = { l: 6, r: 6, t: phone ? 34 : 40, b: phone ? 58 : 66 };
    const w = side - m.l - m.r, h = side - m.t - m.b;
    const X = (f) => m.l + (f / 10) * w, Y = (p) => m.t + (1 - p / 10) * h;
    geo = { X, Y, m, w, h };
    const svg = $("graph");
    svg.setAttribute("width", side);
    svg.setAttribute("height", side);
    svg.setAttribute("viewBox", `0 0 ${side} ${side}`);
    svg.replaceChildren();

    // Everything at or above score k is the corner above the line 10p - 5f = k.
    const region = (k) => {
      const pts = k <= 50 ? [[0, k / 10], [10, (k + 50) / 10], [10, 10], [0, 10]] : [[0, k / 10], [(100 - k) / 5, 10], [0, 10]];
      return pts.map(([f, p]) => `${X(f)},${Y(p)}`).join(" ");
    };
    const line = (k) => {
      const end = k <= 50 ? [10, (k + 50) / 10] : [(100 - k) / 5, 10];
      return `M${X(0)},${Y(k / 10)} L${X(end[0])},${Y(end[1])}`;
    };
    // The same three bands as the map: lowland, the middle from 40, summits from 70.
    svg.append(el("rect", { class: "low", x: m.l, y: m.t, width: w, height: h }));
    svg.append(el("polygon", { class: "mid", points: region(40) }));
    svg.append(el("polygon", { class: "high", points: region(70) }));
    // Score 0: the fix costs double the pain, or more.
    svg.append(el("polygon", { class: "dead", points: [[0, 0], [10, 0], [10, 5]].map(([f, p]) => `${X(f)},${Y(p)}`).join(" ") }));
    const tilt = (-Math.atan2(h * 0.05, w * 0.1) * 180) / Math.PI;
    for (let k = 0; k <= 90; k += 10) {
      svg.append(el("path", { class: `iso${k === 70 || k === 40 ? " call" : ""}`, d: line(k) }));
      if (k % 20 === 0 && k && k !== 40) {
        const f = 0.3, p = (k + 5 * f) / 10;
        svg.append(el("text", { class: "iso-num", x: X(f), y: Y(p) - 6, transform: `rotate(${tilt} ${X(f)} ${Y(p) - 6})` }, k));
      }
    }
    svg.append(el("rect", { class: "frame", x: m.l, y: m.t, width: w, height: h }));

    // Axes in plain words, set level so nobody has to tilt their head.
    const up = el("text", { class: "axis", x: m.l, y: m.t - 12 }, "↑ problem ");
    up.append(el("tspan", {}, "mild to hair on fire"));
    svg.append(up);
    svg.append(el("text", { class: "axis", x: m.l, y: m.t + h + (phone ? 28 : 32) }, "fix →"));
    svg.append(el("text", { class: "end", x: m.l, y: side - 6 }, "nothing to learn"));
    svg.append(el("text", { class: "end", x: m.l + w, y: side - 6, "text-anchor": "end" }, "new habit, pay, upkeep"));

    // The ideas on the map. Integers pile up, so fan each pile out a little.
    const piles = new Map();
    for (const i of ideas) {
      const key = `${i.problem},${i.fix}`;
      const n = piles.get(key) ?? 0;
      piles.set(key, n + 1);
      const ang = n * 2.4, r = n ? 8 + n * 2.5 : 0;
      const c = el("circle", { class: `idea${i.sample ? " sample" : ""}`, cx: X(i.fix) + Math.cos(ang) * r, cy: Y(i.problem) + Math.sin(ang) * r, r: 6.5, fill: "#15251c" });
      c.append(el("title", {}, `${i.title}: ${i.score}`));
      svg.append(c);
    }

    // Zone names go on last so the ideas never sit on top of the words.
    const along = (k, f, text, cls) => {
      const p = (k + 5 * f) / 10;
      svg.append(el("text", { class: cls, x: X(f), y: Y(p) - 10, transform: `rotate(${tilt} ${X(f)} ${Y(p) - 10})` }, text));
    };
    along(70, 0.3, "build it", "zone-name");
    along(40, 0.3, "sharpen it", "zone-name");
    along(0, phone ? 5.4 : 4.4, phone ? "scores 0" : "scores 0: the fix costs double the pain", "zone-name quiet");

    for (const k of ["a", "b"]) {
      const { p, f } = pins[k];
      const g = el("g", { class: "knob", tabindex: 0, role: "slider", "aria-label": `Idea ${k.toUpperCase()}: problem ${p}, fix ${f}, score ${score(p, f)}. Arrow keys move it.`, "data-k": k, transform: `translate(${X(f)} ${Y(p)})` });
      g.append(el("circle", { r: 21, fill: k === "a" ? "#15251c" : "#f2500a" }));
      g.append(el("text", { y: 7.5 }, k.toUpperCase()));
      g.append(el("text", { class: "tag", x: f >= 8 ? -70 : 30, y: 9 }, score(p, f)));
      svg.append(g);
    }
    readout();
  }

  // Drag (or arrow-key) a pin. Ratings are whole numbers, so pins snap to the grid.
  const clamp = (n) => Math.max(0, Math.min(10, Math.round(n)));
  let dragging = null;
  const move = (e) => {
    if (!dragging) return;
    const r = $("graph").getBoundingClientRect();
    const f = clamp(((e.clientX - r.left - geo.m.l) / geo.w) * 10);
    const p = clamp((1 - (e.clientY - r.top - geo.m.t) / geo.h) * 10);
    if (f !== pins[dragging].f || p !== pins[dragging].p) {
      pins[dragging] = { p, f };
      draw();
    }
  };
  $("graph").addEventListener("pointerdown", (e) => {
    const k = e.target.closest(".knob")?.dataset.k;
    if (!k) return;
    dragging = k;
    $("graph").setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  $("graph").addEventListener("pointermove", move);
  for (const ev of ["pointerup", "pointercancel"]) $("graph").addEventListener(ev, () => (dragging = null));
  $("graph").addEventListener("keydown", (e) => {
    const k = e.target.closest(".knob")?.dataset.k;
    const step = { ArrowUp: [1, 0], ArrowDown: [-1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
    if (!k || !step) return;
    e.preventDefault();
    pins[k] = { p: clamp(pins[k].p + step[0]), f: clamp(pins[k].f + step[1]) };
    draw();
    $("graph").querySelector(`[data-k="${k}"]`)?.focus();
  });

  let resizing;
  new ResizeObserver(() => {
    clearTimeout(resizing);
    resizing = setTimeout(draw, 120);
  }).observe($("plot"));

  const apply = (d) => {
    $("name").textContent = d.name;
    ideas = d.trunks.flatMap((t) => t.branches.flatMap((b) => b.ideas));
    if (!dragging) draw();
  };
  draw();
  fetch("/api/map", { cache: "no-store" }).then((r) => r.json()).then(apply).catch(() => {});
  const es = new EventSource("/api/events");
  es.onmessage = (e) => apply(JSON.parse(e.data));
})();
</script>
</body>
</html>
